# Render Blueprint (alternative to Railway). Fill the secret values in the Render dashboard.
services:
  - type: web
    name: book-by-the-people
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: AI_KEY_SECRET
        generateValue: true
      - key: SITE_ADMIN_EMAILS
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
